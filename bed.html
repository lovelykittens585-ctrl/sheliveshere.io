    <style>
       body {

    .ascii-art {
      position: absolute;
      inset: 0;
      z-index: 0;
      white-space: pre;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }
      body {
    /* Set the background image source */
    background-image: url('PLACEHOLDER.jpg');

    /* Scale the image to cover the entire container */
    background-size: cover;

    /* Center the image horizontally and vertically */
    background-position: center center;

    /* Prevent the image from repeating like a tile */
    background-repeat: no-repeat;

    /* Keep the background fixed during page scroll (Optional) */
    background-attachment: fixed;

    /* Ensure the body spans the full height of the viewport */
    min-height: 100vh;
    margin: 0;
}
